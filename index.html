<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Expression Evaluation Quiz</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #dcfce7;
            --success-border: #22c55e;
            --error: #fee2e2;
            --error-border: #ef4444;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .question-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .question-number {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        code {
            background-color: #e1e7ef;
            color: #b91c1c;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .option-label:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }

        /* States for evaluated answers */
        .option-label.correct {
            background-color: var(--success);
            border-color: var(--success-border);
            color: #14532d;
        }

        .option-label.wrong {
            background-color: var(--error);
            border-color: var(--error-border);
            color: #7f1d1d;
        }

        .option-label.disabled {
            pointer-events: none;
            opacity: 0.8;
        }

        /* Expandable Div (Details/Summary) */
        .explanation {
            margin-top: 15px;
            display: none;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-left: 4px solid var(--primary);
            border-radius: 6px;
            overflow: hidden;
        }

        .explanation summary {
            padding: 12px 15px;
            background: #f1f5f9;
            cursor: pointer;
            font-weight: 600;
            color: var(--primary);
            user-select: none;
            outline: none;
        }
        
        .explanation summary:hover {
            background: #e2e8f0;
        }

        .explanation p {
            padding: 15px;
            margin: 0;
            font-size: 0.95rem;
            color: #334155;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 30px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }
        
        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .results-container {
            display: none;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 8px;
            animation: fadeIn 0.5s;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #166534;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Python Expression Evaluation</h1>
        <p class="subtitle">Test your knowledge of operators, precedence, and associativity.</p>
        
        <div id="quiz-container"></div>
        
        <button id="submit-btn" class="submit-btn" onclick="gradeQuiz()">Submit Quiz</button>
        
        <div id="results-container" class="results-container">
            <h2>Quiz Complete!</h2>
            <div class="score" id="score-display"></div>
            <p>Review your answers and read the explanations below.</p>
        </div>
    </div>

    <script>
        const quizData = [
            {
                q: "2 ** 3 ** 2",
                options: ["64", "512", "12", "24"],
                ans: 1,
                exp: "Exponentiation (**) has right-to-left associativity. It evaluates as 2 ** (3 ** 2) &rarr; 2 ** 9 &rarr; 512."
            },
            {
                q: "-1 or 5 and 6",
                options: ["-1", "5", "6", "False"],
                ans: 0,
                exp: "The 'and' operator has higher precedence than 'or'. However, 'or' uses short-circuit evaluation. Since -1 is a truthy value, the expression immediately evaluates to -1 without evaluating the right side."
            },
            {
                q: "True or False and not True",
                options: ["True", "False", "None", "Error"],
                ans: 0,
                exp: "Precedence is: 'not' &rarr; 'and' &rarr; 'or'. Evaluates as: True or (False and (not True)) &rarr; True or (False and False) &rarr; True or False &rarr; True."
            },
            {
                q: "5 // 3 % 2 + 2 * 4",
                options: ["8", "9", "10", "1"],
                ans: 1,
                exp: "Multiplicative operators (//, %, *) have the same precedence and associate left-to-right. Then addition is applied. (5 // 3) = 1. (1 % 2) = 1. (2 * 4) = 8. Finally, 1 + 8 = 9."
            },
            {
                q: "5 // 3 # 2 + 2 * 4",
                options: ["1", "9", "8", "SyntaxError"],
                ans: 0,
                exp: "Trick question! In Python, '#' denotes a comment. Everything after the '#' is ignored by the interpreter. The expression is simply '5 // 3', which evaluates to 1."
            },
            {
                q: "10 - 4 * 2",
                options: ["12", "2", "8", "-2"],
                ans: 1,
                exp: "Multiplication (*) has higher precedence than subtraction (-). It evaluates as 10 - (4 * 2) &rarr; 10 - 8 &rarr; 2."
            },
            {
                q: "3 << 1 + 1",
                options: ["7", "12", "4", "8"],
                ans: 1,
                exp: "Addition (+) has higher precedence than bitwise shifts (<<). It evaluates as 3 << (1 + 1) &rarr; 3 << 2 &rarr; 12."
            },
            {
                q: "2 == 2 > 1",
                options: ["True", "False", "TypeError", "1"],
                ans: 0,
                exp: "In Python, comparison operators chain. This is equivalent to (2 == 2) and (2 > 1). Both are True, so True and True &rarr; True."
            },
            {
                q: "5 in [1, 2, 5, 4] == True",
                options: ["True", "False", "TypeError", "None"],
                ans: 1,
                exp: "Another chained comparison! 'in' and '==' have the same precedence. It evaluates as (5 in [1, 2, 5, 4]) and ([1, 2, 5, 4] == True). While the first part is True, the list is not equal to the boolean True. Therefore, True and False &rarr; False."
            },
            {
                q: "10 / 2 * 5",
                options: ["1.0", "25.0", "25", "1"],
                ans: 1,
                exp: "Division (/) and multiplication (*) share precedence and associate left-to-right. 10 / 2 evaluates to the float 5.0. Then 5.0 * 5 evaluates to 25.0."
            },
            {
                q: "not \"\" and 5 > 2",
                options: ["True", "False", "TypeError", "None"],
                ans: 0,
                exp: "Precedence is: '>' &rarr; 'not' &rarr; 'and'. '5 > 2' is True. 'not \"\"' is True (empty strings are falsy). True and True &rarr; True."
            },
            {
                q: "4 & 3 | 2",
                options: ["2", "0", "7", "5"],
                ans: 0,
                exp: "Bitwise AND (&) has higher precedence than Bitwise OR (|). 4 & 3 evaluates to 0 (binary 100 & 011 = 000). Then 0 | 2 evaluates to 2 (binary 000 | 010 = 010)."
            },
            {
                q: "~5",
                options: ["4", "-5", "-6", "5"],
                ans: 2,
                exp: "The bitwise NOT operator (~) inverts the bits. In two's complement arithmetic, ~x is mathematically equivalent to -(x + 1). So ~5 is -6."
            },
            {
                q: "0 or \"\" or [] or 4",
                options: ["0", "\"\" (Empty String)", "[]", "4"],
                ans: 3,
                exp: "The 'or' operator returns the first truthy value it encounters. 0, empty string, and empty list are all falsy. It returns 4, which is truthy."
            },
            {
                q: "\"hello\" and 5",
                options: ["\"hello\"", "5", "True", "False"],
                ans: 1,
                exp: "The 'and' operator returns the first falsy value, or the last truthy value if all are truthy. Since both are truthy, it returns the last one evaluated, which is 5."
            },
            {
                q: "2 ** 3 ** 0",
                options: ["1", "2", "8", "0"],
                ans: 1,
                exp: "Right-to-left associativity applies for **. It evaluates as 2 ** (3 ** 0). 3 ** 0 is 1. Then 2 ** 1 is 2."
            },
            {
                q: "False == (False or True)",
                options: ["True", "False", "TypeError", "None"],
                ans: 1,
                exp: "Parentheses enforce precedence. (False or True) evaluates to True. Then False == True evaluates to False."
            },
            {
                q: "False == False or True",
                options: ["True", "False", "TypeError", "None"],
                ans: 0,
                exp: "Equality (==) has higher precedence than 'or'. False == False evaluates to True. Then True or True evaluates to True."
            },
            {
                q: "3 * 'A'",
                options: ["\"3A\"", "\"A3\"", "\"AAA\"", "TypeError"],
                ans: 2,
                exp: "The multiplication operator (*), when used with an integer and a string, performs string repetition. 'A' repeated 3 times is 'AAA'."
            },
            {
                q: "10 % 3 * 2",
                options: ["1", "2", "6", "0"],
                ans: 1,
                exp: "Modulo (%) and multiplication (*) have the same precedence and associate left-to-right. 10 % 3 evaluates to 1. Then 1 * 2 evaluates to 2."
            }
        ];

        const quizContainer = document.getElementById('quiz-container');

        // Render Quiz
        quizData.forEach((item, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-card';
            
            // Build options HTML
            let optionsHTML = '';
            item.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <label class="option-label" id="label-q${index}-o${optIndex}">
                        <input type="radio" name="q${index}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });

            questionDiv.innerHTML = `
                <div class="question-text">
                    <span class="question-number">${index + 1}</span> 
                    <code>${item.q}</code>
                </div>
                <div class="options-container">
                    ${optionsHTML}
                </div>
                <details class="explanation" id="exp-${index}">
                    <summary>View Explanation</summary>
                    <p>${item.exp}</p>
                </details>
            `;
            quizContainer.appendChild(questionDiv);
        });

        function gradeQuiz() {
            let score = 0;
            
            quizData.forEach((item, index) => {
                // Get selected radio
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const expDiv = document.getElementById(`exp-${index}`);
                
                // Reveal Explanation
                expDiv.style.display = 'block';
                
                // Disable all radios in this question to prevent changes after submission
                const radios = document.querySelectorAll(`input[name="q${index}"]`);
                radios.forEach(radio => {
                    radio.disabled = true;
                    radio.parentElement.classList.add('disabled');
                });

                if (selected) {
                    const selectedVal = parseInt(selected.value);
                    const selectedLabel = document.getElementById(`label-q${index}-o${selectedVal}`);
                    
                    if (selectedVal === item.ans) {
                        score++;
                        selectedLabel.classList.add('correct');
                    } else {
                        selectedLabel.classList.add('wrong');
                        // Highlight the actual correct answer
                        const correctLabel = document.getElementById(`label-q${index}-o${item.ans}`);
                        correctLabel.classList.add('correct');
                    }
                } else {
                    // If skipped, just highlight the correct answer
                    const correctLabel = document.getElementById(`label-q${index}-o${item.ans}`);
                    correctLabel.classList.add('correct');
                }
            });

            // Handle UI updates post-submission
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Quiz Evaluated";

            const resultsContainer = document.getElementById('results-container');
            const scoreDisplay = document.getElementById('score-display');
            
            scoreDisplay.innerText = `${score} / ${quizData.length}`;
            resultsContainer.style.display = 'block';

            // Scroll to bottom slowly to view results
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
