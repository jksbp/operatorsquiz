<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Expressions Interactive Quiz</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --correct-bg: #d1fae5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 30px;
            background: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .progress-text {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .progress-bar-container {
            height: 6px;
            background: #475569;
            width: 100%;
        }

        .progress-bar {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 0.4s ease;
        }

        .slide-content {
            padding: 30px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .question-box {
            margin-bottom: 25px;
        }

        .question-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .expression {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            background: #f1f5f9;
            padding: 15px 20px;
            border-radius: 8px;
            color: #b91c1c;
            font-weight: bold;
            border-left: 5px solid #cbd5e1;
            margin-bottom: 15px;
            word-wrap: break-word;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', Courier, monospace;
            color: #334155;
            font-weight: 600;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #94a3b8;
            background: #f1f5f9;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Feedback States */
        .option-btn.correct {
            background: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
        }

        .option-btn.wrong {
            background: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
        }

        .feedback-container {
            display: none;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.4s ease forwards;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .correct-title { color: var(--correct-text); }
        .wrong-title { color: var(--wrong-text); }

        .explanation-text {
            color: #475569;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .next-btn {
            display: none;
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: auto;
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        /* Results Screen */
        .results-container {
            text-align: center;
            padding: 40px 20px;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #eff6ff;
            border: 8px solid var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0 auto 20px auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-slide {
            animation: fadeIn 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header">
            <h1>Python Precedence Quiz</h1>
            <div class="progress-text" id="progress-text">Question 1 / 20</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="slide-content" id="slide-content">
            <!-- Content dynamically injected here -->
        </div>
    </div>

    <script>
        const quizData = [
            {
                q: "5 + 3 * 2 // 4",
                options: ["1", "4", "6", "6.5"],
                ans: 2,
                exp: "Multiplication (*) and integer division (//) have higher precedence than addition (+), and they evaluate left-to-right. First, 3 * 2 = 6. Then 6 // 4 = 1. Finally, 5 + 1 = 6."
            },
            {
                q: '0 and 5 or "hello"',
                options: ['0', '5', '"hello"', 'False'],
                ans: 2,
                exp: "'and' has higher precedence than 'or'. '0 and 5' evaluates to 0 (because 0 is falsy). The expression becomes '0 or \"hello\"'. Since 0 is falsy, 'or' returns the second operand, '\"hello\"'."
            },
            {
                q: "2 ** 2 ** 3",
                options: ["64", "256", "12", "16"],
                ans: 1,
                exp: "Exponentiation (**) is right-associative. This evaluates as 2 ** (2 ** 3). First, 2 ** 3 = 8. Then 2 ** 8 = 256. (If it were left-associative, it would be 64)."
            },
            {
                q: "5 > 3 == 3",
                options: ["True", "False", "TypeError", "1"],
                ans: 0,
                exp: "Python supports chained comparisons. This is implicitly evaluated as (5 > 3) and (3 == 3). Both sub-expressions are True, so True and True evaluates to True."
            },
            {
                q: "4 << 1 + 2",
                options: ["12", "32", "10", "16"],
                ans: 1,
                exp: "Addition (+) has a higher precedence than bitwise shifts (<<). First, 1 + 2 = 3. Then, 4 << 3 shifts the bits of 4 left by 3 positions, effectively multiplying 4 by 2^3 (8), resulting in 32."
            },
            {
                q: "10 % 4 * 3 // 2",
                options: ["0", "3", "2", "6"],
                ans: 1,
                exp: "Modulo (%), multiplication (*), and floor division (//) share the same precedence and are evaluated strictly left-to-right. 10 % 4 = 2. Then 2 * 3 = 6. Finally 6 // 2 = 3."
            },
            {
                q: "[1, 2] == [1, 2] is True",
                options: ["True", "False", "TypeError", "SyntaxError"],
                ans: 1,
                exp: "This is a chained comparison! It translates to ([1, 2] == [1, 2]) and ([1, 2] is True). While the first part is True, a list is not identical (is) to the boolean True. Therefore, True and False = False."
            },
            {
                q: "3 ^ 4 & 5",
                options: ["1", "7", "4", "2"],
                ans: 1,
                exp: "Bitwise AND (&) has higher precedence than bitwise XOR (^). First, 4 & 5 (100 & 101) = 4 (100). Then, 3 ^ 4 (011 ^ 100) = 7 (111)."
            },
            {
                q: '"A" * 2 + "B" * 0',
                options: ['"AAB"', '"AA0"', '"AA"', 'TypeError'],
                ans: 2,
                exp: "Multiplication (*) has precedence over addition (+). 'A' * 2 is 'AA'. 'B' * 0 is an empty string ''. Adding them together ('AA' + '') results in 'AA'."
            },
            {
                q: "[1, 2] * 3 > [1, 2, 1]",
                options: ["True", "False", "TypeError", "ValueError"],
                ans: 0,
                exp: "First, the list multiplication expands the list: [1, 2, 1, 2, 1, 2]. Then list comparison occurs element by element. At index 3, the left list has 2, while the right list has nothing. Left list is deemed greater. Thus, True."
            },
            {
                q: "not 10 - 10",
                options: ["True", "False", "TypeError", "None"],
                ans: 0,
                exp: "Subtraction (-) has higher precedence than boolean 'not'. First, 10 - 10 = 0. Then, 'not 0' evaluates to True (since 0 is falsy)."
            },
            {
                q: "True + False + 2",
                options: ["True", "False", "TypeError", "3"],
                ans: 3,
                exp: "In Python, booleans are a subclass of integers. True evaluates to 1 and False evaluates to 0 during arithmetic. So, 1 + 0 + 2 = 3."
            },
            {
                q: "~-5",
                options: ["4", "5", "-4", "-6"],
                ans: 0,
                exp: "The bitwise NOT operator (~) returns mathematically -(x + 1). So ~(-5) is -(-5 + 1) = -(-4) = 4."
            },
            {
                q: "1 if 0 else 2 * 3",
                options: ["1", "6", "0", "TypeError"],
                ans: 1,
                exp: "The conditional expression evaluates the condition in the middle first. '0' is falsy. Therefore, it evaluates and returns the 'else' part, which is 2 * 3 = 6."
            },
            {
                q: "(1, 2) + (3,) * 2",
                options: ["(1, 2, 3, 3)", "(1, 2, 6)", "TypeError", "(1, 2, 3, 2)"],
                ans: 0,
                exp: "Multiplication (*) has higher precedence than addition (+). (3,) * 2 repeats the tuple: (3, 3). Then (1, 2) + (3, 3) concatenates the tuples resulting in (1, 2, 3, 3)."
            },
            {
                q: "1 in [[1], 2, 3]",
                options: ["True", "False", "TypeError", "1"],
                ans: 1,
                exp: "The 'in' operator checks for exact membership at the top level. The elements of the list are the list [1], the int 2, and the int 3. The int 1 is not a top-level element, so it returns False."
            },
            {
                q: '"a" in "abc" == True',
                options: ["True", "False", "TypeError", "SyntaxError"],
                ans: 1,
                exp: "Another chained comparison! This is evaluated as ('a' in 'abc') and ('abc' == True). The first part is True, but the string 'abc' does not equal the boolean True. True and False = False."
            },
            {
                q: "8 / 2 * (2 + 2)",
                options: ["1.0", "1", "16.0", "16"],
                ans: 2,
                exp: "Parentheses have the highest precedence: (2 + 2) = 4. Next, division (/) and multiplication (*) have equal precedence and are evaluated left-to-right. 8 / 2 = 4.0 (division always returns a float). 4.0 * 4 = 16.0."
            },
            {
                q: "not None is None",
                options: ["True", "False", "SyntaxError", "TypeError"],
                ans: 1,
                exp: "'is' has higher precedence than 'not'. First, 'None is None' evaluates to True. Then, 'not True' evaluates to False."
            },
            {
                q: "0.1 + 0.2 == 0.3",
                options: ["True", "False", "TypeError", "None"],
                ans: 1,
                exp: "False. Due to how floating-point numbers are represented in binary (IEEE 754), 0.1 + 0.2 actually evaluates to 0.30000000000000004 in Python, which is not strictly equal to 0.3."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const slideContent = document.getElementById('slide-content');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        function loadQuestion() {
            const qData = quizData[currentQuestion];
            
            // Update Progress
            const progressPercent = (currentQuestion / quizData.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            progressText.innerText = `Question ${currentQuestion + 1} / ${quizData.length}`;

            // Build HTML for the slide
            let optionsHtml = '';
            qData.options.forEach((opt, index) => {
                optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${opt}</button>`;
            });

            slideContent.innerHTML = `
                <div class="fade-slide">
                    <div class="question-box">
                        <div class="question-label">Evaluate this expression:</div>
                        <div class="expression">${qData.q}</div>
                    </div>
                    <div class="options-grid" id="options-grid">
                        ${optionsHtml}
                    </div>
                    
                    <div class="feedback-container" id="feedback">
                        <div class="feedback-title" id="feedback-title"></div>
                        <div class="explanation-text">${qData.exp}</div>
                    </div>

                    <button class="next-btn" id="next-btn" onclick="nextSlide()">
                        ${currentQuestion === quizData.length - 1 ? 'Show Results' : 'Next Question &rarr;'}
                    </button>
                </div>
            `;
        }

        function checkAnswer(selectedIndex) {
            const qData = quizData[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            const feedbackContainer = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title');
            const nextBtn = document.getElementById('next-btn');

            // Disable all buttons to prevent multiple clicks
            buttons.forEach(btn => btn.disabled = true);

            const correctIndex = qData.ans;

            if (selectedIndex === correctIndex) {
                score++;
                buttons[selectedIndex].classList.add('correct');
                feedbackTitle.innerText = "✓ Correct!";
                feedbackTitle.className = "feedback-title correct-title";
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
                feedbackTitle.innerText = "✗ Incorrect";
                feedbackTitle.className = "feedback-title wrong-title";
            }

            // Show feedback and next button
            feedbackContainer.style.display = 'block';
            nextBtn.style.display = 'block';
        }

        function nextSlide() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            progressBar.style.width = '100%';
            progressText.innerText = `Quiz Complete`;
            
            let message = "";
            if(score === quizData.length) message = "Perfect Score! Master of Python Precedence!";
            else if(score >= 15) message = "Great job! You have a solid grasp of Python expressions.";
            else if(score >= 10) message = "Good effort, but review chaining and bitwise operators.";
            else message = "Keep studying! Python precedence can be tricky.";

            slideContent.innerHTML = `
                <div class="fade-slide results-container">
                    <h2>Quiz Completed!</h2>
                    <div class="score-circle">${score}/${quizData.length}</div>
                    <p style="font-size: 1.1rem; color: #475569; margin-bottom: 30px;">${message}</p>
                    <button class="next-btn" style="display:inline-block;" onclick="restartQuiz()">Restart Quiz</button>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            loadQuestion();
        }

        // Initialize first question
        loadQuestion();
    </script>
</body>
</html>
